# ===================================================================
# Spring Boot Configuration Properties
# OIL SIF-Lens AI Backend
# ===================================================================

# Server Port: Render dynamically provides the PORT environment variable.
# Defaults to 8080 for local development.
server.port=${PORT:8080}
spring.application.name=sif-backend

# -------------------------------------------------------------------
# MongoDB Database Configuration
# Defaults to local MongoDB container for development.
# On Render, set MONGODB_URI to your MongoDB Atlas connection string.
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sifdb}
spring.data.mongodb.auto-index-creation=true

# Demo Data Seeding (default true locally, set SEED_DEMO_DATA=false in production)
app.seed-demo-data=${SEED_DEMO_DATA:true}

# -------------------------------------------------------------------
# CORS Configuration
# Comma-separated list of allowed origin URLs
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# -------------------------------------------------------------------
# AI Service Endpoint Configuration
# Set AI_SERVICE_URL in Render to your deployed FastAPI web service URL
# (e.g. https://your-ai-service.onrender.com). Defaults to localhost for dev.
# -------------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:10000}

# -------------------------------------------------------------------
# Rate Limiting & Proxy Forwarding
# -------------------------------------------------------------------
server.forward-headers-strategy=framework
app.rate-limit.analyze-per-minute=${RATE_LIMIT_PER_MINUTE:10}

# -------------------------------------------------------------------
# Spring Security & JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:sif_enterprise_default_secret_key_change_in_production_32chars}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:1440}

# Admin Seed Credentials (seeded only if users collection is empty)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Allow bean overriding if needed
spring.main.allow-bean-definition-overriding=true
