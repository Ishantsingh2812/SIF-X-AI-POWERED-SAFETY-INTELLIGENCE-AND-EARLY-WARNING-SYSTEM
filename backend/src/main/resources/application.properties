# ===================================================================
# Spring Boot Configuration Properties
# OIL SIF-Lens AI Backend
# ===================================================================

# Server Port: Render dynamically provides the PORT environment variable.
# Defaults to 8080 for local development.
server.port=${PORT:8080}
spring.application.name=sif-backend

# -------------------------------------------------------------------
# MongoDB Atlas Database Configuration
# In Render's dashboard, you can define MONGODB_URI directly as an Environment Variable:
# MONGODB_URI=mongodb+srv://si2721747_db_user:<password>@cluster0.kgumvbf.mongodb.net/sif_safety_db?retryWrites=true&w=majority&appName=Cluster0
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://${DB_USER:si2721747_db_user}:${DB_PASS:<db_password>}@cluster0.kgumvbf.mongodb.net/sif_safety_db?retryWrites=true&w=majority&appName=Cluster0}

# -------------------------------------------------------------------
# AI Service Endpoint Configuration
# Set AI_SERVICE_URL in Render to your deployed FastAPI web service URL
# (e.g. https://your-ai-service.onrender.com). Defaults to localhost for dev.
# -------------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# Allow bean overriding if needed
spring.main.allow-bean-definition-overriding=true
