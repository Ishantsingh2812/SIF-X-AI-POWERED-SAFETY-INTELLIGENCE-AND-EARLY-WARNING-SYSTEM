# ===================================================================
# Spring Boot Configuration Properties
# OIL SIF-Lens AI Backend
# ===================================================================

# Server Port: Render dynamically injects the PORT environment variable.
# Falls back to 8080 for local development.
server.port=${PORT:8080}
spring.application.name=sif-backend

# The backend repositories use JPA, so configure a JDBC database here.
# This in-memory H2 database is suitable for the prototype; data resets on restart.
spring.datasource.url=mongodb+srv://${DB_USER}:yYLfaih2gwZR7Hai@cluster0.36lumhq.mongodb.net/?appName=Cluster0
spring.datasource.driverClassName=${DB_USER}
spring.datasource.username=${DB_PASS}
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Web-based H2 database console (available in local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# AI Service Endpoint Configuration
# Uses AI_SERVICE_URL environment variable on Render, falling back to
# local FastAPI instance at http://127.0.0.1:8000
# -------------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

spring.main.allow-bean-definition-overriding=true
