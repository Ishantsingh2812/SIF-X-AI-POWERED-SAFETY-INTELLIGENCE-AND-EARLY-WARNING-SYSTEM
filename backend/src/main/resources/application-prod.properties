# ===============================
# PRODUCTION
# ===============================

server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Demo data
app.seed-demo-data=${SEED_DEMO_DATA:false}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# AI service
ai.service.url=${AI_SERVICE_URL}
ai.service.api-key=${AI_SERVICE_API_KEY:}

ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:10000}

# Rate limiting
app.rate-limit.analyze-per-minute=${RATE_LIMIT_PER_MINUTE:10}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:1440}

# Admin
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.main.allow-bean-definition-overriding=true